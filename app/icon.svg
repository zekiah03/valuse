<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background: rounded square in indigo -->
  <rect width="32" height="32" rx="7" fill="#6366F1"/>

  <!-- Inner grid ring (r=4, hexagon, pointy-top) -->
  <polygon
    points="16,12 19.46,14 19.46,18 16,20 12.54,18 12.54,14"
    fill="none" stroke="white" stroke-width="0.5" opacity="0.3"
  />
  <!-- Outer grid ring (r=8) -->
  <polygon
    points="16,8 22.93,12 22.93,20 16,24 9.07,20 9.07,12"
    fill="none" stroke="white" stroke-width="0.5" opacity="0.3"
  />

  <!-- 6 axis lines: center (16,16) → outer vertices -->
  <line x1="16" y1="16" x2="16"    y2="8"    stroke="white" stroke-width="0.5" opacity="0.35"/>
  <line x1="16" y1="16" x2="22.93" y2="12"   stroke="white" stroke-width="0.5" opacity="0.35"/>
  <line x1="16" y1="16" x2="22.93" y2="20"   stroke="white" stroke-width="0.5" opacity="0.35"/>
  <line x1="16" y1="16" x2="16"    y2="24"   stroke="white" stroke-width="0.5" opacity="0.35"/>
  <line x1="16" y1="16" x2="9.07"  y2="20"   stroke="white" stroke-width="0.5" opacity="0.35"/>
  <line x1="16" y1="16" x2="9.07"  y2="12"   stroke="white" stroke-width="0.5" opacity="0.35"/>

  <!--
    Data polygon — each vertex is on one axis at a % of r=8:
      top(85%=6.8):       (16, 9.2)
      top-right(65%=5.2): (20.5, 13.4)
      bottom-right(90%=7.2): (22.2, 19.6)
      bottom(50%=4.0):    (16, 20)
      bottom-left(75%=6.0): (10.8, 19)
      top-left(70%=5.6):  (11.2, 13.2)
  -->
  <polygon
    points="16,9.2 20.5,13.4 22.2,19.6 16,20 10.8,19 11.2,13.2"
    fill="white" opacity="0.25"
  />
  <polygon
    points="16,9.2 20.5,13.4 22.2,19.6 16,20 10.8,19 11.2,13.2"
    fill="none" stroke="white" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"
  />

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.1" fill="white" opacity="0.95"/>
</svg>
